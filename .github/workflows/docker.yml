# Workflow reutilizable: construye la imagen Docker y la prueba antes de aceptarla.
name: Docker

on:
  workflow_call:
    inputs:
      version:
        description: Versión que se graba en la imagen (APP_VERSION)
        type: string
        default: dev

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      LOCAL_IMAGE: devops-up:ci
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen
        run: docker build --build-arg APP_VERSION="$VERSION" -t "$LOCAL_IMAGE" .

      - name: Verificar que no corre como root
        run: test "$(docker run --rm --entrypoint id "$LOCAL_IMAGE" -u)" != "0"

      - name: Prueba de humo (arranca y responde /health)
        run: |
          docker run -d --name smoke -p 8000:8000 -e BACKEND=simulator "$LOCAL_IMAGE"
          for _ in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
