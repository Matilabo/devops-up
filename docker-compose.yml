# Entorno local completo con un solo comando:  docker compose up --build
# - api:  la API, conectada al demonio de Docker del host por su socket.
# - demo: un nginx para tener un contenedor que listar, medir, reiniciar y detener.
services:
  api:
    build:
      context: .
      args:
        APP_VERSION: dev
    image: devops-up:dev
    ports:
      - "8000:8000"
    environment:
      BACKEND: ${BACKEND:-docker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # El usuario no-root necesita el grupo dueño del socket:
      # 0 en Docker Desktop; en Linux, el GID del grupo docker (getent group docker).
      - "${DOCKER_GID:-0}"
    depends_on:
      - demo
    restart: unless-stopped

  demo:
    image: nginx:1.30.6-alpine
